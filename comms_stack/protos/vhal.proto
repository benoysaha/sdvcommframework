syntax = "proto3";

package vhal;

message VhalProperty {
    int32 id = 1;
    int32 area_id = 2;
    oneof value {
        bool bool_value = 3;
        float float_value = 4;
        int32 int32_value = 5;
        string string_value = 6;
        bytes bytes_value = 7;
        int64 int64_value = 8;
    }
}

message GetVhalPropertyRequest {
    int32 property_id = 1;
    int32 area_id = 2;
}

message GetVhalPropertyResponse {
    VhalProperty property = 1;
}

message SetVhalPropertyRequest {
    VhalProperty property = 1;
}

message SetVhalPropertyResponse {
    // Empty for now, can be extended with error codes
}

message SubscribeVhalPropertyRequest {
    int32 property_id = 1;
    int32 area_id = 2;
    float sample_rate = 3;
}

message SubscribeVhalPropertyResponse {
    // Empty for now, can be extended with error codes
}

message VhalPropertyUpdate {
    VhalProperty property = 1;
}
